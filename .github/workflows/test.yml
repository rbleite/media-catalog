name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel earlier runs on the same ref — the most recent push wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # the catalogue is built on one machine and read on another, so the
      # parsing has to agree across all three — path separators and the
      # console encoding differ on Windows
      # (macos-14 was retired by GitHub on 2026-11-02: jobs on it are
      # cancelled at once, without a log)
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        # mutagen and ebmlite are TEST-ONLY oracles: they write/parse the
        # container fixtures so the hand-written parsers are checked against
        # independent implementations. media_catalog itself stays stdlib-only.
        run: python -m pip install --upgrade pip pytest mutagen ebmlite

      - name: run tests
        run: python -m pytest tests/ -q
